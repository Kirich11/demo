spring.application.name=demo
server.port=8080
logging.level.org.springframework.web=debug

spring.config.import=optional:file:.env[.properties]

spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=dbo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.user=${DB_USER}
spring.flyway.baseline-version=0
spring.flyway.baselineOnMigrate=true
spring.flyway.schemas=dbo
spring.flyway.locations=classpath:db/migrations/postgresql
spring.flyway.cleanDisabled=true
